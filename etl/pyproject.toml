[project]
name = "healthcare-performance-data-platform-etl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.38.38",
    "dask>=2025.5.1",
    "datasets>=3.6.0",
    "dbt-core>=1.9.8",
    "dbt-duckdb>=1.9.3",
    "huggingface-hub>=0.33.0",
    "scikit-learn>=1.7.0",
    "jupyter>=1.1.1",
    "papermill>=2.6.0",
    "pytest>=8.4.1",
    "pyspark==3.4.4",
    "delta-spark==2.4.0",
    "dbt-snowflake>=1.9.2",
]

# ETL-specific development dependencies
[tool.uv]
dev-dependencies = [
    "apache-airflow==2.7.1",
    "jupysql>=0.10.17",
    "pygwalker>=0.4.9.14",
]

# Workspace managed at root level

# ETL-specific dependency groups
[dependency-groups]
# ETL testing with Airflow support
etl-test = [
    "apache-airflow>=2.7.1",
    "pendulum>=2.1.2",
]

# ETL development tools
etl-dev = [
    "healthcare-performance-data-platform-etl[etl-test]",
]

# Pytest configuration
[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "--color=yes",
    "--durations=10",
    "--cov=dags",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=80",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests", 
    "slow: Slow running tests",
    "fastapi: FastAPI related tests",
    "dag: DAG structure tests",
    "utils: Utility function tests",
    "fallback: Fallback mechanism tests",
    "mock: Tests with extensive mocking",
]
timeout = 300
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning:airflow.*",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

# Coverage configuration
[tool.coverage.run]
source = ["dags"]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
