[tool.uv.workspace]
members = [
    "backend",
    "etl"
]

# Consolidated tool configuration
[tool.uv]
dev-dependencies = [
    # Core linting and formatting
    "ruff>=0.12.0",
    "mypy>=1.16.1", 
    "isort>=6.0.0",
    "black>=23.0.0",
    
    # Testing framework
    "pytest>=8.4.1",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-timeout>=2.1.0",
    "pytest-html>=3.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-benchmark>=4.0.0",
    "pytest-xdist>=3.3.0",
    "pytest-sugar>=0.9.7",
    
    # ETL development tools (Jupyter ecosystem)
    "jupyter>=1.1.1",
    "jupyterlab>=4.3.4",
    "jupyterlab-code-formatter>=3.0.2",
    "jupyter-resource-usage>=1.1.1",
    "python-lsp-server[all]>=1.12.2",
    "jupyterlab-lsp>=5.1.0",
    "jupyterlab-git>=0.51.0",
    "jupyterlab-search-replace>=1.1.0",
    
    # Testing utilities
    "mock>=4.0.3",
    "factory-boy>=3.2.0",
    "faker>=18.0.0",
    "responses>=0.23.0",
    "requests-mock>=1.10.0",
    "httpx>=0.24.0",
    "hypothesis>=6.75.0",
    "freezegun>=1.2.0",
    
    # Data manipulation for testing
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    
    # Environment management
    "python-dotenv>=1.0.0",
    
    # Code quality
    "flake8>=5.0.0",
]

# Shared development tools across the monorepo
[dependency-groups]
lint = [
    "ruff>=0.12.0",
    "mypy>=1.16.1", 
    "isort>=6.0.0",
    "black>=23.0.0",
    "flake8>=5.0.0",
]

test = [
    "pytest>=8.4.1",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-timeout>=2.1.0",
    "pytest-html>=3.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-benchmark>=4.0.0",
    "pytest-xdist>=3.3.0",
    "pytest-sugar>=0.9.7",
    "mock>=4.0.3",
    "factory-boy>=3.2.0",
    "faker>=18.0.0",
    "responses>=0.23.0",
    "requests-mock>=1.10.0",
    "httpx>=0.24.0",
    "hypothesis>=6.75.0",
    "freezegun>=1.2.0",
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    "python-dotenv>=1.0.0",
]

dev = [
    "healthcare-performance-data-platform[lint,test]",
    "jupyter>=1.1.1",
    "jupyterlab>=4.3.4",
    "jupyterlab-code-formatter>=3.0.2",
    "jupyter-resource-usage>=1.1.1",
    "python-lsp-server[all]>=1.12.2",
    "jupyterlab-lsp>=5.1.0",
    "jupyterlab-git>=0.51.0",
    "jupyterlab-search-replace>=1.1.0",
]

[project]
name = "healthcare-performance-data-platform"
version = "0.1.0"
description = "Healthcare Performance Data Platform"
requires-python = ">=3.11"
dependencies = []