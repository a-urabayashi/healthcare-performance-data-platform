# ローカル開発用のDockerfile
# version: '3.7'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - DEV=true
        - DEBUG=0
    volumes:
      - ./app:/app
      - static-data:/vol/web
    ports:
      - "8000:8000"
    command: >
      bash -c "python manage.py wait_for_db &&
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000"

    ### ↑↑初回Runserver用↑↑ #####
    healthcheck:
      # test: ["CMD", "curl", "-f", "http://localhost:8000/healthcheck/"]
      test: ["CMD", "python", "manage.py", "migrate", "--check"]
      start_period : 20s
      interval: 20s
      retries: 3
    env_file:
      - ./app/.env
    deploy:
      resources:
        limits:
          cpus: '0.6'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M
    depends_on:
      - db
      - redis
  
  db:
    # image: postgres:13-alpine
    build:
      context: ./db/
      dockerfile: Dockerfile
      args:
        - DEV=true
        - DEBUG=1
    volumes:
      - dev-postgres-data:/var/lib/postgres/data
    environment:
      - POSTGRES_DB=devdb
      - POSTGRES_USER=devuser
      - POSTGRES_PASSWORD=changeme
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h db -U devuser -d devdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "5432:5432"

  redis:
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  dev-postgres-data:
  static-data:
